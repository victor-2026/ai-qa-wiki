<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-secondary: #f6f8fa;
    --bg-tertiary: #eaeef2;
    --border: #d0d7de;
    --text: #1f2328;
    --text-secondary: #656d76;
    --heading: #1f2328;
    --link: #0969da;
    --link-hover: #0550ae;
    --code-bg: #f6f8fa;
    --code-text: #1f2328;
    --blockquote-bg: #f6f8fa;
    --blockquote-border: #d0d7de;
    --table-border: #d0d7de;
    --table-alt: #f6f8fa;
    --selection: rgba(9,105,218,0.3);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --border: #30363d;
      --text: #c9d1d9;
      --text-secondary: #8b949e;
      --heading: #e6edf3;
      --link: #58a6ff;
      --link-hover: #79c0ff;
      --code-bg: #161b22;
      --code-text: #c9d1d9;
      --blockquote-bg: #161b22;
      --blockquote-border: #30363d;
      --table-border: #21262d;
      --table-alt: #161b22;
      --selection: rgba(56,139,253,0.3);
    }
  }
  * { box-sizing: border-box; }
  ::selection { background: var(--selection); }
  html { font-size: 16px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    line-height: 1.6;
    color: var(--text);
    background: var(--bg);
    margin: 0;
    padding: 0;
  }
  .container {
    max-width: 1012px;
    margin: 0 auto;
    padding: 32px 16px;
  }
  h1, h2, h3, h4, h5, h6 {
    color: var(--heading);
    font-weight: 600;
    margin-top: 24px;
    margin-bottom: 16px;
  }
  h1 { font-size: 2em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
  h2 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
  h3 { font-size: 1.25em; }
  a { color: var(--link); text-decoration: none; }
  a:hover { color: var(--link-hover); text-decoration: underline; }
  p { margin-top: 0; margin-bottom: 16px; }
  code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    background: var(--code-bg);
    color: var(--code-text);
    font-size: 85%;
    padding: 0.2em 0.4em;
    border-radius: 6px;
  }
  pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    overflow-x: auto;
    line-height: 1.45;
  }
  pre code {
    background: transparent;
    padding: 0;
    font-size: 85%;
  }
  blockquote {
    margin: 0;
    padding: 0 1em;
    color: var(--text-secondary);
    border-left: 0.25em solid var(--blockquote-border);
    background: var(--blockquote-bg);
    padding: 8px 16px;
    border-radius: 0 6px 6px 0;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
  }
  th, td {
    border: 1px solid var(--table-border);
    padding: 8px 12px;
    text-align: left;
  }
  th { background: var(--bg-tertiary); font-weight: 600; }
  tr:nth-child(even) td { background: var(--table-alt); }
  ul, ol { padding-left: 2em; margin-bottom: 16px; }
  li { margin: 0.25em 0; }
  hr { height: 1px; background: var(--border); border: none; margin: 24px 0; }
  img { max-width: 100%; border-radius: 6px; }
  .header { border-bottom: 1px solid var(--border); margin-bottom: 32px; padding-bottom: 16px; }
  .header h1 { border: none; margin: 0; font-size: 1.5em; }
  .header a { color: var(--heading); text-decoration: none; }
  .header a:hover { color: var(--link); }
  .footer { border-top: 1px solid var(--border); margin-top: 48px; padding-top: 16px; color: var(--text-secondary); font-size: 0.85em; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <a href="/ai-qa-wiki/"><h1>{{ site.title }}</h1></a>
  </div>
  {{ content }}
  <div class="footer">
    <a href="https://github.com/victor-2026/ai-qa-wiki">github.com/victor-2026/ai-qa-wiki</a>
  </div>
</div>
</body>
</html>
